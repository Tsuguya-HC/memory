name: Digest cooldown

# See Tsuguya/digest-cooldown. pull_request_target, not pull_request: the
# workflow definition then comes from main, so a PR cannot weaken the gate that
# is judging it. The action never checks out or runs head-side code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: digest-cooldown-${{ github.event.pull_request.number || 'scan' }}
  cancel-in-progress: false

jobs:
  cooldown:
    name: Digest cooldown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write
      pull-requests: write
      contents: read
    steps:
      - uses: Tsuguya/digest-cooldown@8cef1af948c0b09c5b1fd900deeb65bb3a7c8ba8 # v1.0.0
        with:
          cooldown-days: 3
          skip-registries: registry.infra.tgy.io,ghcr.io/tsuguya
          gate-version-bumps: true
          # Once this repo moves to the self-hosted Renovate its PR author
          # becomes tsuguya-home-cluster[bot]; both are listed so the broad
          # strategy keeps applying across the switch.
          gate-authors: renovate[bot],tsuguya-home-cluster[bot]
          always-report: true

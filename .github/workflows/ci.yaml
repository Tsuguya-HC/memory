name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

  # The only required status check. Aggregates every correctness leaf so the
  # ruleset never names an individual job: adding, renaming or matrix-splitting
  # a job below can't leave a required context that is never reported (which
  # blocks the PR forever). ai-review is deliberately excluded — it is
  # conditional and advisory, and it merges the PR itself.
  gate:
    name: CI Gate
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          # fail-closed: an empty needs list would make the loop pass vacuously
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::No job results to aggregate (empty needs) — failing closed."
            exit 1
          fi
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::A required job concluded with: ${r}"; exit 1 ;;
            esac
          done

  # Called by explicit ref rather than `./…`, which would resolve to this
  # branch's copy. claude-code-action refuses to run when the workflow it is
  # in differs from the default branch's version — a sane rule, since a PR
  # could otherwise rewrite its own reviewer — but under `pull_request` a
  # same-repo PR runs its own head's workflow file, so every branch cut before
  # the last edit to this file failed that check, and an Actions bump (which
  # edits this file by definition) could never pass it at all. Pinning @main
  # means the reviewed content and the reviewing content are separate things.
  ai-review:
    needs: [build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      !contains(github.event.pull_request.body, '**Automerge**: Enabled')
    uses: Tsuguya/memory/.github/workflows/ai-review.yaml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # claude-code-action exchanges an OIDC token; without this the job fails
      # with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
      id-token: write

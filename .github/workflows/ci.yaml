name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

  # The only required status check. Aggregates every correctness leaf so the
  # ruleset never names an individual job: adding, renaming or matrix-splitting
  # a job below can't leave a required context that is never reported (which
  # blocks the PR forever). ai-review is deliberately excluded — it is
  # conditional and advisory, and it merges the PR itself.
  gate:
    name: CI Gate
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          # fail-closed: an empty needs list would make the loop pass vacuously
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::No job results to aggregate (empty needs) — failing closed."
            exit 1
          fi
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::A required job concluded with: ${r}"; exit 1 ;;
            esac
          done

  # Called by explicit ref rather than `./…`, which would resolve to this
  # branch's copy. claude-code-action refuses to run when the workflow differs
  # from the default branch's version — a sane rule, since a PR could
  # otherwise rewrite its own reviewer — and under `pull_request` a same-repo
  # PR runs its own head's copy, so a branch cut before the last edit here
  # fails for reasons that have nothing to do with the change under review.
  #
  # The @main pin does not get around that: the check reads the entrypoint
  # workflow, which is this file on the branch, so a PR that edits this file
  # still fails it — measured on #25 and #27, which bump an action and a
  # node-version and cannot be reviewed at all. What the pin does buy is that
  # the reviewer's capabilities — token, tool allow-list, prompt — are read
  # from main rather than from the branch, so editing them in a PR no longer
  # changes what runs against that PR. Rebasing is what clears a stale branch.
  ai-review:
    needs: [build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      !contains(github.event.pull_request.body, '**Automerge**: Enabled')
    uses: Tsuguya/memory/.github/workflows/ai-review.yaml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # claude-code-action exchanges an OIDC token; without this the job fails
      # with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
      id-token: write

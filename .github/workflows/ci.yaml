name: CI

# The Claude reviewer used to be called from this file. It now has its own
# entry point in claude-review.yml, because claude-code-action validates the
# workflow that invoked it against main — and a PR that edits this file (every
# Renovate action bump did) would otherwise be unreviewable.
#
# 必須ステータスチェックを単一 gate に集約するオーケストレーター。
# 各検査は workflow_call の leaf にあり、ここはそれを組み立てるだけ。
#
# トリガーに paths フィルタは付けない。leaf をトリガー側で絞ると、該当しない
# PR ではチェックが報告されず、必須化された context が
# "Expected — Waiting for status to be reported" のまま永久にブロックする。
# 代わりに起動は常にして、`detect` が leaf ごとの実行要否を出す。skip した
# leaf は gate から見て `skipped` = 合格扱いになるので、報告は常に発生する。
#
# push トリガーは持たない。main の ruleset は `pull_request` を要求していて
# 直 push は通らないので、main が進むのはマージのときだけ ——「その内容は
# 直前に PR でこの CI を通っている」。

on:
  pull_request:
    branches: [main]
    # `edited` on top of the default opened/synchronize/reopened. Changing a
    # PR's base is an `edited` activity, so a PR opened against another branch
    # and later retargeted at main never matched `branches:` and never produced
    # a CI Gate check at all — the required context stays "Expected — Waiting
    # for status to be reported" and the PR cannot merge until someone pushes
    # to it.
    #
    # detect を入れたことで塞ぐものが 1 つ増えた。retarget では head SHA が
    # 変わらないので、`edited` が無いと旧 base で計算した detect の結果
    # （= leaf を skip した緑）がそのまま新 base の必須チェックに流用できる。
    types: [opened, synchronize, reopened, edited]
  # マージキューは main に対する一時 commit（gh-readonly-queue/main/pr-N-<sha>）
  # の上で必須チェックを取り直す。ここで報告しないとキューの entry は永久に待つ。
  # detect の dorny/paths-filter は merge_group を base_sha..head_sha で解釈する。
  merge_group:

# Only the Claude reviewer needs to write, and it lives in its own workflow.
# Everything here asks for what it needs, so a job added below starts with
# nothing rather than inheriting the default token scope.
permissions: {}

concurrency:
  # merge_group には event.number が無いので ref（キューの一時ブランチ）で分ける。
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 変更ファイル種別を判定し、各 leaf を実行すべきかを outputs で返す。
  # merge-base 等のエッジケースを正しく扱うため dorny/paths-filter を使う。
  #
  # leaf 自身のワークフローファイルも各フィルタに入れてある（自己参照）。leaf の
  # 中身を変えた PR がその leaf を走らせないのでは検証にならない。
  detect:
    name: detect changes
    # checkout と paths-filter しか動かないので slim で足りる。ツールを要求
    # するのは leaf 側で、そちらは ubuntu-latest のまま。
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter が PR の変更ファイル一覧を API 取得するために必要
    outputs:
      app: ${{ steps.filter.outputs.app }}
      workflows: ${{ steps.filter.outputs.workflows }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Dockerfile も含める。イメージの node がずれれば、ここで解決した
            # lock file が向こうで同じに解決する保証がなくなる。
            app:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'Dockerfile'
              - '.github/workflows/_build.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/zizmor.yml'
            renovate:
              - 'renovate.json*'

  build:
    needs: detect
    if: ${{ needs.detect.outputs.app == 'true' }}
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read

  # ワークフロー自身の検査。actionlint と zizmor のピンは home-actions 側にあり、
  # ここは呼び先の SHA を追うだけ。aqua.yaml は要らない（共有ワークフローが
  # AQUA_CONFIG で自分の _tooling/aqua.yaml を使う）。
  lint-workflows:
    needs: detect
    if: ${{ needs.detect.outputs.workflows == 'true' }}
    uses: Tsuguya-HC/home-actions/.github/workflows/lint-workflows.yml@10834ead7a2c2ca71677a6b818cd066d329eacbb # v1.2.0
    permissions:
      contents: read

  # Renovate 設定の検証。Renovate は知らないキーを黙って捨てるので（PR も警告も
  # 出ない）、バリデータだけがこの層の間違いを検出できる。home-cluster は
  # `ignoredAuthors` の綴り違いを 5 週間放置していた。
  lint-renovate:
    needs: detect
    if: ${{ needs.detect.outputs.renovate == 'true' }}
    uses: Tsuguya-HC/home-actions/.github/workflows/lint-renovate.yml@10834ead7a2c2ca71677a6b818cd066d329eacbb # v1.2.0
    permissions:
      contents: read

  # The only required status check. Aggregates every correctness leaf so the
  # ruleset never names an individual job: adding, renaming or matrix-splitting
  # a job below can't leave a required context that is never reported (which
  # blocks the PR forever). The Claude reviewer is deliberately not part of it —
  # it is advisory and conditional, and it waits on this gate rather than being
  # gated by it.
  #
  # `detect` も needs に含める。detect が失敗すると全 leaf の `if` が偽になって
  # skip され、skip は合格扱いなので、detect を見ていないと「何も検査していない
  # 緑」が必須チェックを満たしてしまう。
  gate:
    name: CI Gate
    needs: [detect, build, lint-workflows, lint-renovate]
    # `!cancelled()` rather than `always()`: under always(), cancelling a run
    # leaves every leaf reporting `cancelled`, which falls through the case
    # below and records the required check as a failure.
    if: ${{ !cancelled() }}
    # 集計は bash の for ループだけなので slim で足りる。
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          # fail-closed: an empty needs list would make the loop pass vacuously
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::No job results to aggregate (empty needs) — failing closed."
            exit 1
          fi
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::A required job concluded with: ${r}"; exit 1 ;;
            esac
          done
          echo "All required jobs passed or were correctly skipped."

name: AI review (reusable)

# The reviewer itself. Called only from claude-review.yml, which pins this file
# to @main — so everything below is read from the default branch regardless of
# what the PR under review contains. The gating moved here from the caller too:
# `github.event` is the same pull_request payload either way, and keeping it
# here means a change to who gets reviewed does not touch the caller, which has
# to stay byte-identical to main for claude-code-action to run at all.
#
# Renovate's action bumps land here. The caller stays frozen.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token used by claude-code-action"
        required: true

permissions: {}

jobs:
  review:
    # The caller job is already named "AI review"; a reusable check renders as
    # "<caller job> / <callee job>", so keep this one short.
    name: review
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      !contains(github.event.pull_request.body, '**Automerge**: Enabled')
    runs-on: ubuntu-latest
    # The wait below can idle for up to 20 minutes; this stops a hung review
    # from holding a runner for the default six hours on top of that.
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # claude-code-action exchanges an OIDC token; without this the job fails
      # with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
      id-token: write
    steps:
      # Stands in for the `needs: [build]` the caller job had while it lived in
      # ci.yaml. A separate workflow cannot depend on another one's jobs, and
      # this reviewer approves and merges on its own, so it waits for the
      # aggregate gate instead — which is also the check the branch ruleset
      # requires.
      - name: Wait for CI Gate
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `gh pr checks` exits non-zero whenever anything is pending or red,
          # which is most of the loop — hence the `|| true` on the substitution.
          for _ in $(seq 1 40); do
            bucket=$(gh pr checks "$PR" --repo "$REPO" --json name,bucket \
                       --jq '[.[] | select(.name == "CI Gate") | .bucket] | first // ""' \
                     2>/dev/null || true)
            case "${bucket}" in
              pass)
                echo "proceed=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              ""|pending)
                # "" also covers the window before the gate check exists at all
                sleep 30
                ;;
              *)
                echo "::notice::CI Gate concluded '${bucket}' — nothing to review."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done
          echo "::error::Timed out after 20 minutes waiting for CI Gate."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ci.outputs.proceed == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.ci.outputs.proceed == 'true'
        with:
          node-version: "24"

      # Pinned to v1.0.99 — v1.0.100+ has a regression where install.sh
      # silently fails and the SDK can't fall back to its bundled binary.
      # Unpin once anthropics/claude-code-action#1260 lands.
      - uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        if: steps.ci.outputs.proceed == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "renovate[bot]"
          claude_args: "--model claude-sonnet-4-6 --max-turns 12 --disallowedTools Edit,Write,NotebookEdit,WebFetch,WebSearch,Glob,Grep --allowedTools 'Bash(gh:*)' Read"
          prompt: |
            You are reviewing a Renovate npm dependency update PR for a TypeScript service (Hono + MCP SDK + Qdrant client).

            PR: #${{ github.event.pull_request.number }}

            Workflow:
            1. `gh pr view ${{ github.event.pull_request.number }}` — get title, body (Renovate writes release notes summary here)
            2. `gh pr diff ${{ github.event.pull_request.number }}` — see exactly what changed (usually package.json + package-lock.json)
            3. Read `package.json` and the affected source files (`src/index.ts`, `src/mcp.ts`, `src/ollama.ts`, `src/qdrant.ts`, `src/routes.ts`) to see how the package is used
            4. If Renovate's body mentions breaking changes, deprecations, or removed APIs — verify whether our code uses any of them
            5. For major version bumps, also check upstream release notes via `gh api repos/<owner>/<repo>/releases` if not already in the PR body

            Evaluate:
            - No breaking changes affecting APIs we call
            - No removed/renamed exports we import
            - No runtime behavior change that would break our service (Hono routing, MCP SDK transports, Qdrant client API)

            Before any merge, run `gh pr checks ${{ github.event.pull_request.number }}` and look for a pending `renovate/stability-days`. That check is how minimumReleaseAge is enforced, and it stays pending until the cooldown has elapsed. Nothing else stops you from merging through it: the branch ruleset requires `CI Gate` only, and Renovate's own automerge gate does not apply to a merge you perform yourself. If it is pending, comment and stop — do not approve, do not merge.

            Decision:
            - SAFE: `gh pr review ${{ github.event.pull_request.number }} --approve -b "AI Review: <one-line summary of what was checked>"` then `gh pr merge ${{ github.event.pull_request.number }} --squash`
            - CONCERNS: `gh pr comment ${{ github.event.pull_request.number }} -b "<detailed concerns>"` — do NOT approve or merge
